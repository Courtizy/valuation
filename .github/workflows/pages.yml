# Deploys site/ to GitHub Pages. Settings > Pages > Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    # the demo is rebuilt from the current code on every deploy, so code and config changes deploy too
    paths: ["site/**", "src/**", "brand/**", "configs/**", "scripts/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_run:
    # A push made by the Pipeline workflow's token doesn't trigger `push`, so deploy after it.
    workflows: [Pipeline]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Public door: test -> export -> publish. Real companies are already in site/data
      # (committed by the Pipeline workflow); export adds the brand assets, the demo and the changelog.
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/export_site.py
      - name: Stamp asset versions
        # Browsers cache Pages files; a per-commit query string makes them fetch new CSS/JS after each deploy.
        run: |
          v="$(git rev-parse --short=8 HEAD)"
          sed -i "s#assets/styles.css\"#assets/styles.css?v=$v\"#; s#assets/main.js\"#assets/main.js?v=$v\"#; s#brand/css/brand.css\"#brand/css/brand.css?v=$v\"#" site/index.html
          sed -i -E "s#from \"\./([a-z]+)\.js\"#from \"./\1.js?v=$v\"#g" site/assets/*.js
          grep -c "?v=" site/index.html site/assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

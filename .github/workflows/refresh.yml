# Weekly rebuild of every sector and company in configs/public/universe.json, published to the
# site-data branch; the Pages workflow deploys it afterwards. Visitors pick from these
# companies with no token. Start it by hand from the Actions tab, or:
#   gh workflow run refresh.yml
#
# Needs the repository secret SEC_USER_AGENT ("Your Name you@example.com").
name: Refresh

on:
  schedule:
    - cron: "0 7 * * 1"     # Mondays 07:00 UTC; filings change quarterly, so weekly catches each new one
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date YYYY-MM-DD (blank = today)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-publish     # shared with Pipeline, so two saves to site-data never race
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AS_OF: ${{ inputs.as_of }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: src
      SITE_MARKET_DATA: ${{ vars.SITE_MARKET_DATA || 'showcase' }}
      MARKET: ${{ vars.SITE_MARKET_DATA == 'real' && 'all' || 'risk-free' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        run: |
          [[ -z "$AS_OF" || "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad as_of: $AS_OF"; exit 1; }
          [[ -n "$SEC_USER_AGENT" ]] || { echo "set the SEC_USER_AGENT repository secret"; exit 1; }
          echo "AS_OF=${AS_OF:-$(date -u +%F)}" >> "$GITHUB_ENV"

      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: .cache/sec
          key: sec-refresh-${{ github.run_id }}
          restore-keys: |
            sec-refresh-
            sec-

      - name: Build sectors and companies
        run: python scripts/refresh_universe.py --as-of "$AS_OF" --market "$MARKET"

      - name: Load published data
        run: scripts/site_data.sh load

      - name: Publish to site/data
        run: python -m valuation.L3_app.publish --data-dir data --site-dir site --market-data "$SITE_MARKET_DATA"

      - name: Save published data
        run: |
          scripts/site_data.sh save "data: refresh as of ${AS_OF}"

# Runs the valuation pipeline for one ticker, or screens one sector, and publishes
# the results to site/data. Start it from the Actions tab, with
#   gh workflow run pipeline.yml -f ticker=AAPL
#   gh workflow run pipeline.yml -f sector=sic:3674
# or from the site's "Run pipeline" tab.
#
# Needs the repository secret SEC_USER_AGENT ("Your Name you@example.com"); the
# SEC requires contact details in the User-Agent of every request.
name: Pipeline

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (e.g. AAPL); leave blank when screening a sector"
        required: false
        type: string
      sector:
        description: "Sector to screen instead: sic-of:AAPL | sector:technology | sic:3674 | traits:stage=high growth | list:name"
        required: false
        type: string
      as_of:
        description: "As-of date YYYY-MM-DD (blank = today)"
        required: false
        type: string
      models:
        description: "Comma list of models"
        required: false
        default: "dcf"
        type: string
      stop_after:
        description: "Last layer to run (L1 = company detail only)"
        required: false
        default: "L1"
        type: choice
        options: ["L1", "L2"]

permissions:
  contents: write

concurrency:
  group: pipeline-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TICKER: ${{ inputs.ticker }}
      SECTOR: ${{ inputs.sector }}
      AS_OF: ${{ inputs.as_of }}
      MODELS: ${{ inputs.models }}
      STOP_AFTER: ${{ inputs.stop_after }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}   # optional: backup prices and the cross-check
      PYTHONPATH: model          # code lives in model/
      SITE_MARKET_DATA: ${{ vars.SITE_MARKET_DATA || 'showcase' }}
      MARKET: ${{ vars.SITE_MARKET_DATA == 'real' && 'all' || 'risk-free' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        run: |
          if [[ -n "$SECTOR" ]]; then
            [[ "$SECTOR" =~ ^(sector:[a-z_]{3,30}|sic:[0-9]{4}|sic-of:[A-Za-z][A-Za-z0-9.\-]{0,9}|list:[A-Za-z0-9_\-]{1,40}|traits:[a-z_]+=[a-z ]+(;[a-z_]+=[a-z ]+)*)$ ]] || { echo "bad sector: $SECTOR"; exit 1; }
            echo "MODE=sector" >> "$GITHUB_ENV"
          else
            [[ "$TICKER" =~ ^[A-Za-z][A-Za-z0-9.\-]{0,9}$ ]] || { echo "bad ticker: $TICKER"; exit 1; }
            echo "MODE=ticker" >> "$GITHUB_ENV"
          fi
          [[ -z "$AS_OF" || "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad as_of: $AS_OF"; exit 1; }
          [[ "$MODELS" =~ ^[a-z_,]+$ ]] || { echo "bad models: $MODELS"; exit 1; }
          [[ -n "$SEC_USER_AGENT" ]] || { echo "set the SEC_USER_AGENT repository secret"; exit 1; }
          echo "AS_OF=${AS_OF:-$(date -u +%F)}" >> "$GITHUB_ENV"

      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: .cache/sec
          key: sec-${{ inputs.ticker || 'sector' }}-${{ github.run_id }}
          restore-keys: |
            sec-${{ inputs.ticker || 'sector' }}-
            sec-

      - name: Run pipeline
        if: env.MODE == 'ticker'
        # A model that fails is reported; publish whatever finished.
        continue-on-error: ${{ inputs.stop_after == 'L2' }}
        # Showcase mode (default): no price data, so nothing price-derived is published (data terms).
        # Set the repository variable SITE_MARKET_DATA=real only for a private site or licensed data.
        run: python pipeline.py run "$TICKER" --as-of "$AS_OF" --models "$MODELS" --stop-after "$STOP_AFTER" --market "$MARKET"

      - name: Screen sector
        if: env.MODE == 'sector'
        run: python pipeline.py sector "$SECTOR" --as-of "$AS_OF"

      - name: Publish to site/data
        run: python -m L3_app.publish --data-dir data --site-dir site --market-data "$SITE_MARKET_DATA"

      - name: Commit results
        # main can move during a run (you push files, or the site saves comps peers). If the push
        # is rejected, take the latest main and publish again on top of it: data/ is gitignored, so
        # this run's outputs survive the reset, and publish merges them into the newer site/data.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          what="${TICKER^^}"; [[ "$MODE" == "sector" ]] && what="sector ${SECTOR}"
          for attempt in 1 2 3 4; do
            git add site/data
            if git diff --cached --quiet; then
              echo "nothing new to publish"; exit 0
            fi
            git commit -q -m "data: ${what} as of ${AS_OF}"
            if git push; then exit 0; fi
            echo "push rejected (main moved); republishing on the latest main, attempt ${attempt}"
            sleep $((attempt * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m L3_app.publish --data-dir data --site-dir site --market-data "$SITE_MARKET_DATA"
          done
          echo "could not push after 4 attempts"; exit 1

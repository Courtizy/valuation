[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []  # core pipeline is stdlib-only; extras below

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["openpyxl"]   # per-model Excel templates, memo; course parity tests
# The app is a static site (site/) deployed to GitHub Pages; it needs no Python extra.

[tool.setuptools]
package-dir = {"" = "model"}
py-modules = ["lineage"]

[tool.setuptools.packages.find]
where = ["model"]
include = ["L0_ingest*", "L1_detail*", "L2_models*", "L3_app*", "core*", "runner*"]

[tool.setuptools.package-data]
L1_detail = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["model", "tests"]
testpaths = ["tests"]

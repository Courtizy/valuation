[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation"
version = "0.2.1"
requires-python = ">=3.10"
dependencies = []  # core pipeline is stdlib-only; extras below

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["openpyxl"]   # per-model Excel templates, memo; course parity tests
# The app is a static site (site/) deployed to GitHub Pages; it needs no Python extra.

[tool.setuptools.packages.find]
where = ["src"]
include = ["valuation*"]

[tool.setuptools.package-data]
"valuation.L1_detail" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
